limitations:
  - Motor dimensions describe SOYO SY42STH38-1684A, not every NEMA17 motor.
  - Motor boss height is the retained 2 mm illustrative estimate.
  - Coupler dimensions are supplied catalogue data, not a new physical measurement.
  - Grub screw axial position is unspecified in source; midpoint access must be checked against the physical coupler.
  - Bearings are nominal annular envelopes; race faces, seals and chamfers are simplified.
  - Printed fits, material strength, thermal behaviour and load capacity require physical testing.

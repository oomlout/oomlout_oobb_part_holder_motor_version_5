design_choices:
  - STEP mounting axes supersede the previous 22.75 mm offset inferred from the drawing.
  - Use the wider 20.39 mm by 22.4 mm can clearance envelope from the drawing. Keep the rear end open for the boss and leads.
  - The native motor simplifies case ribs, can casing and tabs. Nominal holes and locating features use the supplier STEP. Verify the actual motor with the printed tray.

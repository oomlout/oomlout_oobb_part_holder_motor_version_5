geometry_note: 'Holder only: plain OOBB grid, M1.6 motor face screws, two front M3
  countersunk tension screws and top-loaded native OOBB rear nut pockets. The entry
  step guides the gearbox, and the rear bears on the flat end cap around the boss.
  Two outer-row M3 pockets accept attachment nuts from the rear. Rear is 6 mm thick
  with off-grid structural screw axes; no rails or sleeves. Range-wide screw lengths
  are M3 x 35 / 40 / 45; tips can project beyond the slim rear.'

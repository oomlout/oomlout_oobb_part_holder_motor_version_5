depth_note: 14.2 mm declaration retained. Actual main holder 9 mm, upper plate 7 mm,
  shell 35 mm; fixed top Z=16. Support ring Z=9..10, bearing Z=10..14 wholly inside
  the upper plate Z=9..16. Runner lid Z=19.4..21.6. Ten print pieces.
family: assembly
fit_note: Six researched envelopes; factory screw threads and approximate axial dimensions
  require measurement. Print the labelled coupons first. See SERVO_MICRO_V2.md. Production
  adapter locked to user-selected centre coupon D0/Z0, with the native two-layer socket-roof
  bridge.
geometry_note: Straight 20.6 mm main shaft bore; no bearing counterbore or annular
  print overhang. 1 mm outer-race ring and whole 6704 bearing sit inside the upper
  plate. Four flush M3 x 30 countersunk top screws, ear brackets and standard-design
  two-nut blocks with 3.4 mm pockets at 10.4 mm spacing.

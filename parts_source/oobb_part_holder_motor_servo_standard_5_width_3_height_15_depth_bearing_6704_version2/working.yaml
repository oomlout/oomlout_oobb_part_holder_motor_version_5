  status: user_selected
bearing_size: '6704'
depth: 15
depth_note: 15 mm catalogue declaration retained during design iteration. Lower holder
  10.6 mm, upper plate 5.6 mm, clamshell 45.4 mm, nut bars 6.5 mm, default spacers
  1 mm, output lid 2.2 mm. Bearing Z=10.6..14.6; block Z=-38..16.2; servo countersunk
  heads Z=14.5..16.2, flush; output Z=21.6.
family: assembly
fit_note: MG996R, HS-311, FS5106R and provisional S3004 envelopes; user-specified
  4.5 mm ear holes permit the shifted M3 axes. Select the female runner matching both
  servo and spacer thickness; default 1 mm. Printed friction fits require calibration.
  See SERVO_V2.md for sourced versus estimated dimensions. Production adapter locked
  to user-selected centre coupon D0/Z0, with the native two-layer socket-roof bridge.
geometry_note: Flush top-access M3 x 30 countersunk servo screws, plain holder shafts,
  two floating two-nut bars at 10.4 mm pitch; 0.5/1/2/3 mm shims, default 1 mm. Grid-centred
  6704, 1.5 mm lip, inset M3 stack screws, twelve free captive M3 grid nuts, unobstructed
  bottom passages, four M3 cross nuts and diagonal M3 countersunk runner connectors.
geometry_reference: source_file/servo_v2_reference/mechanical.json
grid_pitch_mm: 15
height: 3
motor_style: standard
motor_type: servo
